<body>

  <!-- Loading Dialog -->
  <div id="loading">
    <div class="cs-dialog" style="min-width: 380px;">
      <div class="heading">
        <div class="wrapper">
          <div style="margin-bottom: 8px;" class="icon"></div>
          <p style="margin-bottom: 5px;" class="text">Loading...</p>
        </div>
      </div>
      <div style="padding: 5px 12px 16px;">
        <p style="color: #919f8a;">Loading website resources...</p>
        <p style="margin-top: 5px;"></p>
        <div style="display: flex;">
          <div class="cs-progress-bar" id="progress-bar">
            <div style="width: 0%" class="bars"></div>
          </div>
          <div class="loading-btns">
            <button class="cs-btn">Cancel</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Main Window -->
  <div id="block" style="display: none;">
    <div class="cs-dialog">
      <div class="heading">
        <div class="wrapper">
          <div style="margin-bottom: 8px;" class="icon"></div>
          <p style="margin-bottom: 5px;" class="text">angelsolver ~ alyx</p>
        </div>
        <button class="cs-btn close"></button>
      </div>

      <div class="cs-tabs">
        <!-- Tab 1: Links -->
        <input class="radiotab" name="tabs" tabindex="1" type="radio" id="tabone" checked="checked" />
        <label class="label" for="tabone">Links</label>
        <div class="panel" tabindex="1">
          <p style="margin-top: 3px;"></p>
          <button class="cs-btn"><a href="https://youtube.com/@gabe.follower?sub_confirmation=1" target="_blank">YouTube - EN</a></button>
          <button class="cs-btn"><a href="https://youtube.com/gabefollower?sub_confirmation=1" target="_blank">YouTube - RU</a></button>
        </div>

        <!-- Tab 2: General Information -->
        <input class="radiotab" name="tabs" tabindex="1" type="radio" id="tabtwo" />
        <label class="label" for="tabtwo">General Information</label>
        <div class="panel" tabindex="1">
          <p>bogk1 ~ Creator angelsolver.lua big project from Ukraine</p>
          <p>Thanks support ~ Valve Software</p>
        </div>

        <!-- Tab 3: News -->
        <input class="radiotab" name="tabs" tabindex="1" type="radio" id="tabthree" />
        <label class="label" for="tabthree">News</label>
        <div class="panel news-panel" tabindex="1">
          <div id="news-container">Loading news...</div>
        </div>
      </div>

      <menu class="footer-btns">
        <button class="cs-btn">OK</button>
        <button class="cs-btn">Cancel</button>
        <button class="cs-btn">Apply</button>
      </menu>
    </div>
  </div>

  <!-- Loading & Logic Script -->
  <script>
    window.onload = function () {
      const progressBar = document.querySelector(".cs-progress-bar .bars");
      const header = document.getElementById("block"); 
      const loadingDiv = document.getElementById("loading");

      let width = 10;
      const maxWidth = 100;

      progressBar.style.width = width + '%';

      setTimeout(() => {
        const progressInterval = setInterval(() => {
          const step = Math.random() * 18;
          width += step;

          if (width > maxWidth) {
            width = maxWidth;
          }

          progressBar.style.width = width + '%';

          if (width === maxWidth) {
            clearInterval(progressInterval);

            setTimeout(() => {
              document.getElementById("progress-bar").style.display = "none";
              loadingDiv.style.display = "none";
              header.style.display = "block";
            }, 200);
          }
        }, 100); 
      }, 500);

      loadNews();
      initCopyButtons();
    };

    // Load News from Pastebin via CORS Proxy
async function loadNews() {
  const container = document.getElementById("news-container");
  try {
    const res = await fetch("https://gist.githubusercontent.com/bogk1/d4ae91918de395ca7e0cad7cb3368597/raw/14160d0c92f106711865fdcb195e3e50f1a0da6f/gistfile1.txt");
    
    if (!res.ok) throw new Error("Network response was not ok");
    
    const data = await res.json();
    
    container.innerHTML = "";

    data.forEach(item => {
      const itemEl = document.createElement("a");
      itemEl.href = item.url;
      itemEl.target = "_blank";
      itemEl.className = `news-item ${item.style === "full" ? "full-style" : "compact-style"}`;

      if (item.style === "full") {
        itemEl.innerHTML = `
          <img class="news-banner" src="${item.imageUrl}" alt="${item.title}" />
          <div class="news-overlay">
            <span class="news-date">${item.date}</span>
            <h3 class="news-title">${item.title}</h3>
            <p class="news-body">${item.body}</p>
          </div>
        `;
      } else {
        itemEl.innerHTML = `
          <img class="news-thumb" src="${item.imageUrl}" alt="${item.title}" />
          <div class="news-content">
            <span class="news-date">${item.date}</span>
            <h3 class="news-title">${item.title}</h3>
            <p class="news-body">${item.body}</p>
          </div>
        `;
      }

      container.appendChild(itemEl);
    });
  } catch (e) {
    console.error("News loading error:", e);
    container.innerHTML = '<span style="color: #ff6b6b;">Error loading news feed.</span>';
  }
}

    // Copy to Clipboard logic
    function initCopyButtons() {
      document.querySelectorAll('.copy-btn').forEach(btn => {
        btn.addEventListener('click', function() {
          const textToCopy = this.parentElement.querySelector('.copy-text').innerText;
          navigator.clipboard.writeText(textToCopy).then(() => {
            const oldText = this.innerText;
            this.innerText = 'Copied!';
            setTimeout(() => {
              this.innerText = oldText;
            }, 1500);
          });
        });
      });
    }
  </script>
</body>
