<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bogk1 | Portfolio</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 650px;
            width: 100%;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 32px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .profile-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 24px;
        }

        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 2px solid #58a6ff;
        }

        .user-info h1 {
            font-size: 1.8rem;
            color: #f0f6fc;
        }

        .user-info p {
            color: #8b949e;
            font-size: 0.95rem;
        }

        .bio {
            line-height: 1.6;
            margin-bottom: 24px;
            color: #c9d1d9;
        }

        .skills {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 28px;
        }

        .tag {
            background-color: #21262d;
            border: 1px solid #30363d;
            color: #58a6ff;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .projects-title {
            font-size: 1.2rem;
            color: #f0f6fc;
            margin-bottom: 16px;
            border-bottom: 1px solid #30363d;
            padding-bottom: 8px;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background-color: #21262d;
            color: #c9d1d9;
            text-decoration: none;
            border-radius: 8px;
            border: 1px solid #30363d;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background-color: #30363d;
            border-color: #8b949e;
            color: #f0f6fc;
            transform: translateY(-2px);
        }

        footer {
            margin-top: 32px;
            text-align: center;
            font-size: 0.8rem;
            color: #484f58;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="profile-header">
            <img class="avatar" src="https://github.com/bogk1.png" alt="bogk1 avatar">
            <div class="user-info">
                <h1>bogk1</h1>
                <p>Developer & Tech Enthusiast</p>
            </div>
        </div>

        <div class="bio">
            Привіт! Це моя особиста сторінка на GitHub Pages. Займаюся розробкою, експериментую з кодом та створюю цікаві проєкти.
        </div>

        <div class="skills">
            <span class="tag">Lua</span>
            <span class="tag">C++</span>
            <span class="tag">Source Engine</span>
            <span class="tag">HTML/CSS</span>
            <span class="tag">Git</span>
        </div>

        <div class="projects-title">Посилання та Проєкти</div>

        <div class="links">
            <a href="https://github.com/bogk1" target="_blank" class="btn">
                <span>GitHub Профіль</span>
                <span>➔</span>
            </a>
            <!-- Додай сюди свої проєкти/посилання -->
            <a href="#" class="btn">
                <span>Мій головний проєкт</span>
                <span>➔</span>
            </a>
        </div>

        <footer>
            © bogk1.github.io
        </footer>
    </div>

</body>
</html>
